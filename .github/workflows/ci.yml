name: ci

# 183 recipes that CONSUMERS read over HTTP, and until this lane existed
# nothing checked one. An overlay recipe is not a build input we can retry:
# `pkgx` fetches it while resolving a closure, so a file that does not parse
# breaks every install of that project, silently, for everyone — with no build
# to go red first.
#
# This lane is deliberately narrow. It does not judge whether a recipe BUILDS;
# it judges whether a recipe can be READ, which is the failure this repository
# is uniquely able to cause.

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }

      # Read by the LOADER THE BUILDER USES — same formats, same schema, same
      # refusals — rather than by a script that re-states parts of the schema
      # in another language.
      #
      # The script this replaces did exactly what a second opinion eventually
      # does: it went looking for package.yml, found none the day these recipes
      # became HCL, and said "the layout changed". That is the mildest way the
      # divergence could have presented. The next one would have been a recipe
      # it judged fine and the builder could not read.
      #
      # `zbk lint` FAILS on an empty tree. A sweep that cannot find its corpus
      # reports the same absence of problems as one that read it all, and the
      # count it prints is the only thing that tells the two apart.
      #
      # ⛔⛔ AND THIS STEP ITSELF STOPPED RUNNING, FOR THE SAME CLASS OF REASON.
      # It invoked `github.com/go-pkgx/bk/cmd/bk@main`. After the rename that
      # module still resolves — `go` finds v0.69.1-0.20261107073303-935e7d1626f0
      # — and simply "does not contain package github.com/go-pkgx/bk/cmd/bk".
      # So every pull request since the rename failed here, on the toolchain
      # rather than on a recipe, and no recipe in this repository has been read
      # by the loader the builder uses since. A gate that fails for a reason of
      # its own is not a gate; it is a red light nobody reads.
      - name: every recipe can be read
        run: go run github.com/go-zpkg/zbk/cmd/zbk@main lint --dir .

      # ⛔⛔ AND EVERY RECIPE WILL EVENTUALLY HAVE TO STAND ALONE, WHICH IS A
      # DIFFERENT QUESTION FROM WHETHER IT PARSES. pantry-overlay#50 reduced
      # all 183 entries to the keys they CHANGE, and that was right: bottle
      # merges this tree OVER PantryBase, so an omitted key is inherited and a
      # small curated tree can correct a stale constraint without forking 1700
      # files.
      #
      # It is exactly wrong for a pantry. `PantryBase` is still
      # `pkgxdev/pantry` compiled in (bottle/pkgx.go:68), so a fragment
      # resolves only because somebody else's recipe sits underneath it — the
      # recipe we may not copy, which is why ours are written rather than
      # converted (go-zpkg/packages#431).
      #
      # 197 of 214 are fragments today, so this cannot be a hard zero: that
      # would fail every pull request on recipes nobody has written yet, which
      # is the exact shape of the defect the step above carries in its own
      # comment. The number is therefore STATED, and --max-fragments refuses an
      # increase AND refuses a stale ceiling — a ceiling nobody lowers stops
      # describing the tree, and a regression then hides in the slack.
      #
      # ⛔ SO COMPLETING A RECIPE MEANS EDITING THIS NUMBER, and that is the
      # point: the lane goes red until it is lowered, which is the one moment
      # anybody is looking.
      #
      # --require-provenance is NOT here yet. 15 of 214 record none, and there
      # is no ratchet for it, so turning it on would be the red light this
      # avoids. It belongs here once those 15 are written or once it has a
      # ceiling of its own.
      - name: no recipe becomes a fragment that was not one already
        run: >
          go run github.com/go-zpkg/zbk/cmd/zbk@main lint --dir .
          --require-standalone --max-fragments 197
