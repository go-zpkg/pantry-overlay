name: ci

# 183 recipes that CONSUMERS read over HTTP, and until this lane existed
# nothing checked one. An overlay recipe is not a build input we can retry:
# `zpkx` fetches it while resolving a closure, so a file that does not parse
# breaks every install of that project, silently, for everyone — with no build
# to go red first.
#
# This lane is deliberately narrow. It does not judge whether a recipe BUILDS;
# it judges whether a recipe can be READ, which is the failure this repository
# is uniquely able to cause.

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }

      # Read by the LOADER THE BUILDER USES — same formats, same schema, same
      # refusals — rather than by a script that re-states parts of the schema
      # in another language.
      #
      # The script this replaces did exactly what a second opinion eventually
      # does: it went looking for package.yml, found none the day these recipes
      # became HCL, and said "the layout changed". That is the mildest way the
      # divergence could have presented. The next one would have been a recipe
      # it judged fine and the builder could not read.
      #
      # `zpkb lint` FAILS on an empty tree. A sweep that cannot find its corpus
      # reports the same absence of problems as one that read it all, and the
      # count it prints is the only thing that tells the two apart.
      #
      # ⛔⛔ AND THIS STEP ITSELF STOPPED RUNNING, FOR THE SAME CLASS OF REASON.
      # It invoked `github.com/go-pkgx/bk/cmd/bk@main`. After the rename that
      # module still resolves — `go` finds v0.69.1-0.20261107073303-935e7d1626f0
      # — and simply "does not contain package github.com/go-pkgx/bk/cmd/bk".
      # So every pull request since the rename failed here, on the toolchain
      # rather than on a recipe, and no recipe in this repository has been read
      # by the loader the builder uses since. A gate that fails for a reason of
      # its own is not a gate; it is a red light nobody reads.
      #
      # ⛔⛔ AND THAT IS WHY THESE THREE STEPS ARE PINNED TO A TAG RATHER THAN
      # @main — MEASURED TODAY, not reasoned about. The provenance step below was
      # added minutes after the flag it needs was merged into zpkb, and the lane
      # went red with `flag provided but not defined: -max-no-provenance`:
      # proxy.golang.org still resolved @main to
      # v0.76.1-0.20261114072102-d2e01c8b0687, the revision from BEFORE the
      # merge, while the repository's main was already at 614d1378. The tool was
      # correct, the lane was red, and nothing in the lane could say which.
      #
      # @main makes this repository's gates depend on a cache nobody here
      # controls, and the house rule is that every tool is under semver. A tag
      # also makes the ratchet number below MEAN something: "186 fragments, as
      # judged by zpkb v0.82.0". Under @main the
      # same numbers were a claim about whatever the proxy served that minute,
      # so a count that moved because the JUDGE changed was indistinguishable
      # from one that moved because a recipe did.
      #
      # Bumping the pin is therefore a deliberate act, and the right one when a
      # newer zpkb reads recipes better. It is not a chore to automate away.
      #
      # ⛔ IT SAT AT v0.79.0 THROUGH v0.80.0 AND v0.81.0, FOR THE REASON ABOVE.
      # v0.80.0 renamed the staging suffix `+brewing` → `+builddir` and v0.81.0
      # added a version-scoped dependency; neither changes anything `lint`
      # judges. Measured before declining each time — all four gates against this
      # tree with a v0.80.0 binary gave the same four verdicts as v0.79.0 — and a
      # bump that moves no number is the chore this note warns against.
      #
      # ⭐ IT MOVES TO v0.82.0 ON 2026-11-16 BECAUSE A STEP NEEDS IT: that tag
      # adds `--require-known-env`, the last step below, which no earlier judge
      # has. That is the "deliberate act" this note asks for rather than a
      # refresh.
      #
      # Measured before bumping, all six gates against this tree with v0.82.0:
      # plain 0, `--require-standalone --max-fragments 186` exactly at the
      # ceiling, `--require-provenance` 0, `--require-hcl` 0, `--render-scripts`
      # 0 — the same five verdicts as v0.79.0, so the bump moves no number of its
      # own — and `--require-known-env` 0 over 233 recipes.
      #
      # Also corrected here: that sentence used to say "195 fragments and 7
      # without provenance, as judged by zpkb v0.78.0" — three facts in one
      # clause, and every one of them had moved. The provenance ceiling is gone
      # (#109: the gate is at zero with no ceiling at all) and the judge is
      # v0.82.0. One version carrying two facts is wrong the moment either of
      # them moves.
      #
      # ⛔ AND ALL THE STEPS CARRY THE SAME TAG, ON PURPOSE. v0.77.0 → v0.78.0
      # for --require-hcl, → v0.79.0 for --render-scripts, → v0.82.0 for
      # --require-known-env. Leaving the
      # earlier steps on an older tag would work and would be worse: this lane
      # would then report numbers from TWO judges, and "as judged by zpkb vX" —
      # the whole reason the pin exists — would stop being a single sentence
      # anyone can check. Each bump is one edit of one string, which is the
      # cheapest part of adding a step.
      - name: every recipe can be read
        run: go run github.com/go-zpkg/zpkb/cmd/zpkb@v0.82.0 lint --dir .

      # ⛔⛔ AND EVERY RECIPE WILL EVENTUALLY HAVE TO STAND ALONE, WHICH IS A
      # DIFFERENT QUESTION FROM WHETHER IT PARSES. go-zpkg/recipes#50 reduced
      # all 183 entries to the keys they CHANGE, and that was right: artifact
      # merges this tree OVER PantryBase, so an omitted key is inherited and a
      # small curated tree can correct a stale constraint without forking 1700
      # files.
      #
      # It is exactly wrong for a pantry. `PantryBase` is still
      # `pkgxdev/pantry` compiled in (artifact/pkgx.go:68), so a fragment
      # resolves only because somebody else's recipe sits underneath it — the
      # recipe we may not copy, which is why ours are written rather than
      # converted (go-zpkg/packages#431).
      #
      # 195 of 216 are fragments today, so this cannot be a hard zero: that
      # would fail every pull request on recipes nobody has written yet, which
      # is the exact shape of the defect the step above carries in its own
      # comment. The number is therefore STATED, and --max-fragments refuses an
      # increase AND refuses a stale ceiling — a ceiling nobody lowers stops
      # describing the tree, and a regression then hides in the slack.
      #
      # ⛔ SO COMPLETING A RECIPE MEANS EDITING THIS NUMBER, and that is the
      # point: the lane goes red until it is lowered, which is the one moment
      # anybody is looking.
      #
      # ⭐ 197 → 196 with gnu.org/grep is the FIRST time this number has moved
      # since #80 set it. Checked rather than assumed: `git log -S max-fragments`
      # names one commit, the one that introduced it. zlib.net, tukaani.org/xz
      # and lz4.org ADDED standalone recipes — the total went 213 → 216 and the
      # fragment count did not change — and gnu.org/gzip already stood alone, so
      # that work gave it a basis rather than a status. grep is the first recipe
      # to stop being a fragment.
      #
      # 196 → 195 with gnu.org/bash, the second.
      #
      # 195 → 194 with gnu.org/make, the third, and the second written from a
      # project's own files rather than completed from what was already there
      # (gnu.org/m4 was the first of those, and it ADDED a recipe, so it moved
      # the total and not this number — the same way zlib.net, tukaani.org/xz
      # and lz4.org did).
      #
      # 194 → 193 with gnu.org/sed, the fourth.
      #
      # 193 → 192 with gnu.org/gawk, the fifth — and the first where reading
      # the source changed a DEPENDENCY LIST rather than a flag list: gawk
      # links libmpfr and libgmp when it finds them, declares neither, and
      # both are in the seed's own closure.
      #
      # 192 → 191 with gnu.org/help2man, the sixth — the member the three
      # before it had to prove they did not need, and the first whose
      # signature our own sourcepin cannot verify (DSA/SHA-1; gpg can).
      #
      # 191 → 190 with gnu.org/coreutils, the seventh — and the one whose
      # `provides` took three readings: a cross-check between man/*.x and
      # man/*.1 AGREED at 108 each and was worthless, because both are man-page
      # sets and coreutils ships pages for programs it does not install.
      #
      # 190 → 189 with gnu.org/binutils, the eighth — and the first where
      # `provides` COULD NOT BE A FLAT LIST. The top-level configure.ac:1103-1132
      # drops `ld gas gdb gprof` for every darwin target, with no --enable to
      # put them back, so the recipe keys `provides` by platform: 12 commands on
      # darwin, 16 on linux. Written on one platform alone it would have been
      # wrong on the other and nothing in the build would have said so.
      #
      # 189 → 188 with github.com/westes/flex, the ninth — and the first where
      # the recipe was ELEVEN RELEASES BEHIND and structurally unable to move:
      # upstream's url spells v2.6.4 with no `{{version}}` in it while its
      # versions source discovers 2.6.15. Also the first settled by BUILDING:
      # three builds on darwin/arm64 gave the darwin FIXME its mechanism
      # (shared libfl has an undefined-by-design yylex, which Mach-O refuses),
      # showed `--enable-shared` to be a libtool default, and showed the
      # `-D_GNU_SOURCE` workaround reaching the one target that already had it.
      #
      # 188 → 187 with gnu.org/wget, the tenth — written under the owner's rule
      # of 2026-11-15, « il faut eviter les trucs implicites ». wget states 22
      # configure switches and TEN decide whether an external library is
      # linked; upstream's recipe stated five, one of them MISSPELLED
      # (`--without-libps1` for `--without-libpsl`), so configure printed
      # "unrecognized options" on every build and libpsl was auto-detected.
      # All ten are stated now, and `wget --version` prints the resulting
      # feature set, so the test block asserts the choice flag by flag.
      #
      # 187 → 186 with freetype.org, the eleventh and the first CMake project:
      # the owner's « rien d'implicite » reads as `option()` and
      # `cmake_dependent_option()` there, where a `FT_DISABLE_X` defaulting OFF
      # is auto-detection spelled backwards. The fragment (#31) already carried
      # four of the nine; the one that mattered was `FT_DISABLE_HVF`, new in
      # this line, which auto-detects an APPLE SDK LIBRARY with no
      # FT_REQUIRE_HVF to pin it — measured, the darwin dylib was carrying
      # /usr/lib/libhvf.dylib.
      #
      # 186 → 185 with python.org, the twelfth — and the LARGEST blocker on
      # go-zpkg/recipes#143's table, which lists 14 projects whose closure waits
      # on it.
      #
      # ⛔ ITS OWN HEADER SAID IT COULD NOT BE DONE HERE: "that is the next
      # step, and it needs a factory build this session cannot run". That was
      # too strong, and the five recipes before it are why — mpdecimal, nghttp2,
      # musl, cmake and ninja were each written without a build, establishing
      # the INPUTS and saying plainly that the build is unproven. A build would
      # confirm; it does not supply the content.
      #
      # ⭐ AND THE AUDIT FOUND A LIVE DEFECT, which is what completing a
      # fragment is for (#85): the recipe DECLARES `libexpat.github.io` and
      # configure.ac:4256-4261 ends with `[with_system_expat="no"]`. The
      # default is to build pyexpat against CPython's OWN BUNDLED COPY, so the
      # dependency was staged, paid for in the closure, and not linked — the
      # dependency list asserting a relationship the build does not have, which
      # is worse than cmake's twelve vendored libraries because there nothing
      # claimed otherwise. Also raised `bytereef.org/mpdecimal` from `2` to
      # `>=2.5.0`, the floor configure.ac:4403 and :4416-4418 both enforce.
      #
      # ⛔⛔ AND IT CARRIES THE BIGGEST AUTO-DETECTION IN THIS TREE. CPython has
      # around thirty optional stdlib modules, each built only if its library
      # was found, and configure.ac:8220-8248 documents the outcome itself:
      # `missing: enabled and not supported`, with `make` exiting 0 either way.
      # No flag turns that into an error — `--with-missing-stdlib-config` only
      # supplies custom message text. So the recipe's test block imports twelve
      # modules by name, one per declared library: it is the only place a
      # dependency that stopped being linked can be caught before a consumer
      # meets it as `import ssl` failing.
      #
      # ⛔ WHICH IS WHY THIS NUMBER IS NOT A PROGRESS BAR FOR
      # go-zpkg/packages#440. Measured 2026-11-15 over the 70-project BUILD
      # closure of go-zpkg/base-toolchain: 14 fragments, 11 standalone, and 45
      # projects the overlay does NOT CARRY AT ALL — 59 of 70 still to do.
      # Writing one of those 45 adds a standalone recipe, which moves the total
      # and leaves this ceiling where it was. So the ceiling measures one of the
      # two kinds of work and the issue tracks both.
      #
      # ⭐ AND THAT PROGRESS BAR IS NOW ONE COMMAND, from zpkb v0.87.0
      # (go-zpkg/zpkb#509): `zpkb closure -build -require-standalone -overlay .
      # go-zpkg/base-toolchain` does the same three-way split the paragraph above
      # did by hand. Measured 2026-11-19, after libssh2.org:
      #
      #   77 project(s); 52 standalone, 5 fragment(s), 20 absent
      #
      # and 2026-11-20, after curl.se:
      #
      #   77 project(s); 53 standalone, 4 fragment(s), 20 absent
      #
      # and the same day, after perl.org:
      #
      #   77 project(s); 54 standalone, 3 fragment(s), 20 absent
      #
      # and the same day, after gnu.org/libidn2 — the first ABSENT project
      # written, so the fragment count and the ceiling below do not move:
      #
      #   77 project(s); 55 standalone, 3 fragment(s), 19 absent
      #
      # and the same day, after nixos.org/patchelf:
      #
      #   77 project(s); 56 standalone, 3 fragment(s), 18 absent
      #
      # and the same day, after gnu.org/gcc:
      #
      #   77 project(s); 57 standalone, 3 fragment(s), 17 absent
      #
      # and the same day, after cpanmin.us:
      #
      #   77 project(s); 58 standalone, 3 fragment(s), 16 absent
      #
      # and the same day, after libgit2.org:
      #
      #   77 project(s); 59 standalone, 3 fragment(s), 15 absent
      #
      # and the same day, after x.org/protocol (xorgproto), the first of the
      # seven-recipe X11 chain of go-zpkg/recipes#167 — no fragment moves, so the
      # ceiling stays:
      #
      #   77 project(s); 60 standalone, 3 fragment(s), 14 absent
      #
      # and the same day, after x.org/xtrans:
      #
      #   77 project(s); 61 standalone, 3 fragment(s), 13 absent
      #
      # and after x.org/libpthread-stubs, which no project of this closure names
      # until libxcb is ours, so the line does not move:
      #
      #   77 project(s); 61 standalone, 3 fragment(s), 13 absent
      #
      # and after x.org/protocol/xcb (xcb-proto):
      #
      #   77 project(s); 62 standalone, 3 fragment(s), 12 absent
      #
      # and after x.org/xau and x.org/xdmcp, written together:
      #
      #   77 project(s); 64 standalone, 3 fragment(s), 10 absent
      #
      # ⚠ The total held at 77 because curl.se REFUSES libpsl rather than
      # declaring it; declaring it measured 93, with sixteen added projects
      # Haskell among them. That choice is a stated downgrade and lives in
      # projects/curl.se/package.hcl, where it can be reversed.
      #
      # ⚠ The two lines are not strictly comparable: 2026-11-15 was counted by
      # hand over a 70-project closure, 2026-11-19 by the tool over 77, and the
      # closure grows as recipes declare what they really need. They point the
      # same way, and only the second can be re-run.
      #
      - name: no recipe becomes a fragment that was not one already
        run: >
          go run github.com/go-zpkg/zpkb/cmd/zpkb@v0.82.0 lint --dir .
          --require-standalone --max-fragments 182

      # ⭐ THIS STEP WAS A COMMENT UNTIL go-zpkg/zpkb#476, and the comment said
      # why: "--require-provenance is NOT here yet. 14 of 216 record none, and
      # there is no ratchet for it, so turning it on would be the red light this
      # avoids. It belongs here once those 14 are written OR ONCE IT HAS A
      # CEILING OF ITS OWN."
      #
      # It has one now. The two ways out were never equal: writing the fourteen
      # means reading fourteen projects' build systems — kernel.org/linux and
      # github.com/ggml-org/llama.cpp among them — so that is a campaign, and
      # while it ran NOTHING protected the 208 recipes that already record
      # provenance. A recipe landing without one was invisible.
      #
      # 14 of 222 when the step was added, measured by the zpkb it pins AND by
      # the v0.76.0 binary installed on the author's machine — the same answer
      # from both, so the number was not an artefact of which build asked. And
      # 216 → 222 since the comment was written while the fourteen did not move,
      # which is exactly the hole this closes: six recipes arrived and none of
      # them had to say anything.
      #
      # ⭐ 14 → 10 in the pull request that added this step, by writing the
      # provenance of the four `github.com/go-authn/*` recipes — the four
      # projects here that are OURS, so their own files could be read at the
      # exact tags the recipes build. That reading found the kind of thing the
      # field exists for: all four commented "go.mod says go 1.27.1" while all
      # four modules state `go 1.27.3` at those tags.
      #
      # ⭐ 10 → 7 with the last three `package.yml` in this tree becoming HCL —
      # compiler-rt.llvm.org/wasi, libcxx.llvm.org/wasi and
      # github.com/WebAssembly/wasi-libc. The overlay is now 222 HCL recipes and
      # ZERO yaml. Their prose already cited wasi-sdk's wasi-sdk-sysroot.cmake
      # by function and line range; every citation was confirmed against the
      # file before being transcribed, and one was wrong (define_libcxx_sub
      # begins at :265, not :272).
      #
      # ⭐ 7 → 4 with github.com/containers/crun, github.com/linux-rdma/
      # rdma-core and openucx.org, and the last of those found a defect that
      # had nothing to do with provenance: two of its test assertions were
      # one-key MAPS rather than commands, and buildscript refused the WHOLE
      # test block. Reading a recipe closely enough to say where its build came
      # from is what found it.
      #
      # ⭐⭐ AND 4 → 0, SO THE CEILING IS GONE. github.com/heimdal/heimdal,
      # github.com/ROCm/ROCR-Runtime, kernel.org/linux and
      # github.com/ggml-org/llama.cpp — the four large ones, each read in its
      # own build system rather than skimmed. `--require-provenance` now stands
      # with NO --max-no-provenance at all, which is the stricter reading and
      # the flag's own default: every one of the 222 recipes records which of
      # its project's files its build came from.
      #
      # ⛔ WHAT THE READING FOUND, because none of it was the point and all of
      # it is why the field exists:
      #   - heimdal: two of ten options are NOT in configure.ac at all
      #     (openssl, berkeley-db live in cf/crypto.m4 and cf/db.m4), and the
      #     ncurses shim is justified by ONE line, configure.ac:453, which
      #     looks for tgetent in termcap/ncurses/curses — never ncursesw.
      #   - ROCR-Runtime: upstream's signal.h:74 promises "Allow hsa_signal_t
      #     to be keys in STL structures" and supplies only a std::less
      #     specialisation; the patch adds the free operator< the comment
      #     implies. IMAGE_SUPPORT=OFF is a real departure (default ON on x86);
      #     BUILD_SHARED_LIBS=ON only restates a default.
      #   - kernel.org/linux: RDMA_RXE depends on INFINIBAND_VIRT_DMA, which
      #     this recipe never names and does not need to (def_bool !HIGHMEM) —
      #     and the test's `grep -q "^CONFIG_RDMA_RXE=y"` is what would catch
      #     it if that ever changed. The `=y` in every assertion matters:
      #     INFINIBAND_USER_ACCESS is a TRISTATE.
      #   - llama.cpp: ggml turns -march=native off by itself when
      #     SOURCE_DATE_EPOCH is set, and our factory does NOT put that
      #     variable in a build's environment — so GGML_NATIVE=OFF is the only
      #     thing between an artifact and the runner's instruction set.
      #
      # ⛔ A REGRESSION IS NOW A HARD FAILURE, which is the point of reaching
      # zero: the next recipe that lands without provenance turns this step red
      # with no number to adjust and no slack to hide in.
      - name: no recipe lands without saying which files its build came from
        run: >
          go run github.com/go-zpkg/zpkb/cmd/zpkb@v0.82.0 lint --dir .
          --require-provenance

      # ⛔ HCL ONLY, AND THIS ONE HAS NO CEILING BECAUSE IT DOES NOT NEED ONE.
      # The decision is the owner's, 2026-11-15: "nous n'avons plus besoin YAML,
      # on fait tout en hcl". This tree reached it the same day — 222
      # package.hcl, zero package.yml — so zero is available and zero is what
      # this asks for. A stated ceiling would be slack where none is needed, and
      # the two ratchets above exist only because THEIR checks could not start
      # at zero.
      #
      # What it protects against is not exotic: `package.yml` is still a name
      # the loader reads, by design, so a yaml recipe dropped in here WORKS and
      # nothing else would say it should not be there. The next person
      # converting an upstream recipe has every reason to paste the yaml first
      # and mean to finish later.
      #
      # ⛔ It judges the file NAMES, and it names a package.yml sitting BESIDE a
      # package.hcl — the state this tree was actually in before its last three
      # recipes were converted. recipefile.Load prefers the HCL, so a check that
      # asked "what would the loader read here?" would report the tree clean
      # with an unread yaml next to it (go-zpkg/zpkb#477).
      - name: our own recipes are HCL, and nothing may add a yaml back
        run: >
          go run github.com/go-zpkg/zpkb/cmd/zpkb@v0.82.0 lint --dir .
          --require-hcl

      # ⛔⛔ A RECIPE CAN PARSE AND STILL DESCRIBE NO STEP, and this tree proved
      # it. Until #107, openucx.org carried two `test` entries that were one-key
      # MAPS rather than strings — what the yaml line
      # `- ucx_info -d | grep -q "Transport: posix"` decodes to, since the `: `
      # inside the quotes splits the item at `"Transport` / `posix"`. The HCL
      # conversion carried that faithfully, so it predated the conversion.
      #
      # buildscript.scriptItem found no `run`, renderRun(nil) hit its default
      # arm, and the ENTIRE test block was unrenderable: `zpkb test
      # openucx.org` could not run. Every step above was GREEN throughout,
      # because parsing a recipe and rendering its script are different
      # questions and none of them asked the second.
      #
      # The judge is the builder's own buildscript.Generate, not a rule here
      # about what a script may contain: a second statement of the schema would
      # disagree with the first one eventually, and then the lane and the build
      # would disagree too.
      #
      # ⭐ A/B measured with this flag over this tree, same 222 recipes:
      # 1 refusal at 760df17, 0 after the repair. One instance, so no ceiling.
      - name: every script a recipe states can actually be rendered
        run: >
          go run github.com/go-zpkg/zpkb/cmd/zpkb@v0.82.0 lint --dir .
          --render-scripts

      # ⛔⛔ FOUR RECIPES OF THIS TREE SHIPPED READING A BUILD VARIABLE THE
      # BUILDER DOES NOT EXPORT, across THREE sweeps that each believed they were
      # the last (go-zpkg/zpkb#494):
      #
      #   kernel.org/linux:75   $ZBK_CC_FREESTANDING   is ZPKB_CC_FREESTANDING
      #   unbound.net:17        $PKGX_DIR              is ZPKG_DIR
      #   llvm.org:184          $PKGX_DIR              is ZPKG_DIR
      #   rust-lang.org/cargo   BREWKIT_TARGET         is ZPKB_TARGET
      #
      # A shell expands an unset variable to the EMPTY STRING and exits 0, so
      # every one of them is silent: no build fails and no test looks. The worst
      # was not a dropped flag — unbound's `sed -i -e "s|$PKGX_DIR/|…|g"` ran as
      # `s|/|…|g`, replacing every slash in an installed script, and the next line
      # deleted the .bak that would have shown it. The kernel's passed `CC=""` on
      # a make command line, which beats kbuild's own assignment.
      #
      # ⛔ AND #97, WHICH MOVED TWO OF THESE RECIPES TO THE MIDDLE SPELLING OF
      # THE PREFIX, PREDICTED IT: "a recipe switched ahead of it reads an UNSET
      # variable, and for these two that is silent". It was right, and it happened
      # again to one of the two, because the prefix it moved them TO was renamed
      # afterwards. Three sweeps of prose did not close this class; this step is
      # the reason a fourth will not be needed.
      #
      # The judge is the builder's own exporter, not a list here: zpkb derives the
      # valid names by RENDERING buildscript.Wrap/WrapTest across every mode
      # (ExportedNames) and adds build.PassThroughEnv. A list in this file would
      # have been a fifth copy of information that had already drifted four times.
      #
      # ⭐ SHOWN RED BEFORE BEING BELIEVED, which is what a new check's zero
      # requires: with this flag over this tree, exit 1 at d8ea26b naming
      # `kernel.org/linux: build: $ZBK_CC_FREESTANDING`, and exit 0 at afade87
      # once #138 fixed it. One instance, so no ceiling.
      - name: no recipe reads a build variable the builder does not export
        run: >
          go run github.com/go-zpkg/zpkb/cmd/zpkb@v0.82.0 lint --dir .
          --require-known-env

      # ⛔⛔ THIS REPOSITORY CALLED ITSELF `pantry-overlay` FOR A DAY AFTER IT WAS
      # RENAMED, STARTING WITH THE FIRST LINE OF ITS OWN README — beside a
      # sentence pointing consumers at `ZPKG_PANTRY_OVERLAY`, which zpkb v0.83.0
      # does not ignore but REFUSES by name (config.CheckRetiredEnv). 72
      # occurrences, every one a self-reference, fixed in #141.
      #
      # ⛔ A DEAD ADDRESS HERE DOES NOT 404, WHICH IS WHY NOTHING CAUGHT IT.
      # GitHub redirects a renamed repository, so `go-zpkg/pantry-overlay#88`
      # still resolves and `raw.githubusercontent.com/go-zpkg/pantry-overlay/…`
      # answers 200 with ZERO redirection (measured 2026-11-16). It holds right
      # up until somebody creates a repository of that name in this org, which
      # would take every one of those addresses in silence.
      #
      # ⭐ IT STARTS AT ZERO AND SO NEEDS NO CEILING, unlike its neighbours
      # above. The 72 were not a judgement call: they name a repository whose
      # issue numbers survived the rename, so each one has exactly one right
      # answer. README.md is the single --allow, because it is now the page that
      # EXPLAINS the rename and must be able to spell the old name — the
      # declared case for that flag, and it is counted and printed, never
      # silent.
      #
      # ⛔ --ext hcl IS LOAD-BEARING, not decoration. The default set is
      # documentation only, and 71 of the 72 were in `package.hcl` comments and
      # provenance blocks: the default run reads 3 of 238 files here and calls
      # the rest clean. staleref's own help says so and it fooled a reader who
      # had read it, which is why fleettools now prints "N of M file(s) read"
      # with a census of what it walked past.
      #
      # ⭐ PINNED TO v0.131.0, WHICH IS THE RELEASE CARRYING fleettools#337 —
      # the promise this step was landed with, kept. Until that tag existed
      # (2026-11-17 12:55:38Z) the report's context window cut mid-rune, so the
      # whole thing was invalid UTF-8 and `grep` refused it: a gate whose
      # FAILURE output could not be read by the tool anybody would reach for.
      # It cost nothing while this was green, which is exactly why a pin left
      # at v0.130.0 would have stayed there until the day it mattered.
      # ⛔⛔ AND THIS FILE IS THE SECOND --allow, BECAUSE A CHECK FOR X CANNOT
      # AVOID CONTAINING X. `--old pantry-overlay` is the step's own argument
      # and `.yml` is in staleref's DEFAULT extension set, so the first version
      # of this step failed on ITSELF: 5 UNSURE, every one of them this comment
      # and that flag. staleref already records the same shape about its own
      # source — run over cmd/staleref it reported 15 DOUBLED, every one a
      # comment explaining the defect it checks for.
      #
      # ⚠ THE COST IS REAL AND IS NOT HIDDEN: this exempts the whole workflow
      # file, so a dead address elsewhere in it would not be caught. It is the
      # narrowest instrument the tool has (--allow is per file), the exemption
      # is COUNTED and printed on every run, and the alternative — moving the
      # invocation into a file the sweep does not read — would hide it instead
      # of declaring it.
      - name: nothing still calls this repository pantry-overlay
        run: >
          go run github.com/go-fleettools/fleettools/cmd/staleref@v0.131.0
          --old pantry-overlay --new recipes
          --ext hcl --allow README.md --allow .github/workflows/ci.yml .
